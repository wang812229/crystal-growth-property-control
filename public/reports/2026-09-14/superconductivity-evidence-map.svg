<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="t d"><title id="t">三类超导问题证据地图</title><desc id="d">比较Rh基硫化物、三层镍酸盐和扭转BSCCO的直接观察、推断与缺口。</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#101a36"/><stop offset="1" stop-color="#281f52"/></linearGradient><linearGradient id="g"><stop stop-color="#5f86ff"/><stop offset="1" stop-color="#9c78ff"/></linearGradient></defs><rect width="1280" height="620" rx="30" fill="url(#b)"/><text x="58" y="70" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="white">超导相关 ≠ 同一种证据：三项工作的层级比较</text><text x="58" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="16" fill="#a9c2ff">蓝色：直接观察　紫色：模型/作者推断　橙色：仍缺的关键互证</text><g font-family="Arial,'Microsoft YaHei',sans-serif"><g><rect x="55" y="150" width="365" height="410" rx="24" fill="#18264a" stroke="#5f86ff"/><text x="82" y="193" font-size="21" font-weight="700" fill="#8fb0ff">Rh₁₇₋ₓFeₓS₁₅</text><text x="82" y="225" font-size="15" fill="#c7d5f7">d电子重质量与再入超导</text><rect x="82" y="260" width="310" height="65" rx="14" fill="#253964"/><text x="100" y="287" font-size="15" fill="white">γ → 312 mJ mol⁻¹ K⁻²</text><text x="100" y="311" font-size="15" fill="white">−lnT / 负MR / T*相干</text><path d="M237 330v32" stroke="#8d72f0" stroke-width="4"/><path d="m228 354 9 11 9-11" fill="none" stroke="#8d72f0" stroke-width="4"/><rect x="82" y="373" width="310" height="65" rx="14" fill="#3c2f66"/><text x="100" y="401" font-size="15" fill="white">Kondo样重电子 + 自旋涨落</text><text x="100" y="425" font-size="14" fill="#dbcffc">85–131 GPa再入超导</text><rect x="82" y="470" width="310" height="55" rx="14" fill="#5a3a32"/><text x="100" y="494" font-size="14" fill="#ffd3a7">缺：体磁化/结构同步；SI配方</text><text x="100" y="515" font-size="14" fill="#ffd3a7">压力梯度与接触仍需排除</text></g><g><rect x="457" y="150" width="365" height="410" rx="24" fill="#18264a" stroke="#5f86ff"/><text x="484" y="193" font-size="21" font-weight="700" fill="#8fb0ff">R₄Ni₃O₁₀</text><text x="484" y="225" font-size="15" fill="#c7d5f7">高压超导之前的正常态</text><rect x="484" y="260" width="310" height="65" rx="14" fill="#253964"/><text x="502" y="287" font-size="15" fill="white">T&lt;30 K、B&lt;~2 T负MR</text><text x="502" y="311" font-size="15" fill="white">按 B⊥=B sinθ 坍缩</text><path d="M639 330v32" stroke="#8d72f0" stroke-width="4"/><path d="m630 354 9 11 9-11" fill="none" stroke="#8d72f0" stroke-width="4"/><rect x="484" y="373" width="310" height="65" rx="14" fill="#3c2f66"/><text x="502" y="401" font-size="15" fill="white">二维弱局域化</text><text x="502" y="425" font-size="14" fill="#dbcffc">面内扩散、层间不相干</text><rect x="484" y="470" width="310" height="55" rx="14" fill="#5a3a32"/><text x="502" y="494" font-size="14" fill="#ffd3a7">缺：压力只到3 GPa</text><text x="502" y="515" font-size="14" fill="#ffd3a7">尚未进入高Tc压力区</text></g><g><rect x="859" y="150" width="365" height="410" rx="24" fill="#18264a" stroke="#9c78ff"/><text x="886" y="193" font-size="21" font-weight="700" fill="#bea9ff">45°扭转 BSCCO</text><text x="886" y="225" font-size="15" fill="#c7d5f7">手性边缘态的实空间指纹</text><rect x="886" y="260" width="310" height="65" rx="14" fill="#253964"/><text x="904" y="287" font-size="15" fill="white">NV静磁：Tc ≈ 86 K</text><text x="904" y="311" font-size="15" fill="white">NV T₁：边缘磁噪声成像</text><path d="M1041 330v32" stroke="#8d72f0" stroke-width="4"/><path d="m1032 354 9 11 9-11" fill="none" stroke="#8d72f0" stroke-width="4"/><rect x="886" y="373" width="310" height="65" rx="14" fill="#3c2f66"/><text x="904" y="401" font-size="15" fill="white">d±id′手性边缘模</text><text x="904" y="425" font-size="14" fill="#dbcffc">角度窗 / 拓扑温标 / 交替畴</text><rect x="886" y="470" width="310" height="55" rx="14" fill="#5a3a32"/><text x="904" y="494" font-size="14" fill="#ffd3a7">缺：相位或热输运互证</text><text x="904" y="515" font-size="14" fill="#ffd3a7">涡旋/弱连接噪声需排除</text></g></g></svg>
