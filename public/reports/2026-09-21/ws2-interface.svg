<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" role="img" aria-labelledby="t d"><title id="t">WS2/Au界面粗糙度与载流子抽取对比</title><desc id="d">根据作者公开稿Methods和正文数值重绘，并非论文原图。</desc><rect width="980" height="500" rx="28" fill="#f7f9ff"/><text x="54" y="56" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17223d">界面平整度改变抽取速度，也改变净光电流</text><text x="54" y="84" font-family="Arial,sans-serif" font-size="14" fill="#64708a">根据作者公开稿 Methods / 正文数值重绘，并非论文原图</text><g font-family="Arial,sans-serif"><rect x="58" y="118" width="408" height="316" rx="22" fill="white" stroke="#dce4ff"/><text x="86" y="154" font-size="18" font-weight="700" fill="#2c4fbd">剥离 WS₂ / 模板剥离 Au</text><path d="M98 265 Q125 250 152 264 T206 263 T260 263 T314 264 T368 263 T426 263" fill="none" stroke="#d7ae48" stroke-width="18"/><path d="M98 226 H426" stroke="#5f86ff" stroke-width="10"/><text x="98" y="196" font-size="15" fill="#64708a">Au 粗糙度 Ra = 0.251 nm</text><rect x="98" y="302" width="150" height="68" rx="14" fill="#eef3ff"/><text x="116" y="327" font-size="13" fill="#64708a">电子抽取</text><text x="116" y="354" font-size="22" font-weight="700" fill="#2c4fbd">60 fs</text><rect x="270" y="302" width="150" height="68" rx="14" fill="#eef3ff"/><text x="288" y="327" font-size="13" fill="#64708a">空穴抽取</text><text x="288" y="354" font-size="22" font-weight="700" fill="#2c4fbd">50 fs</text><text x="98" y="405" font-size="13" fill="#64708a">更快，但电子/空穴较平衡 → 净瞬态电流较小</text><rect x="514" y="118" width="408" height="316" rx="22" fill="white" stroke="#dce4ff"/><text x="542" y="154" font-size="18" font-weight="700" fill="#705bd0">MOCVD WS₂ / 蒸镀 Au</text><path d="M554 265 Q580 216 608 270 T662 231 T716 273 T770 225 T824 272 T882 235" fill="none" stroke="#d7ae48" stroke-width="18"/><path d="M554 226 Q580 212 608 232 T662 216 T716 234 T770 211 T824 233 T882 218" fill="none" stroke="#8b63e6" stroke-width="10"/><text x="554" y="196" font-size="15" fill="#64708a">Au 粗糙度 Ra = 1.06 nm</text><rect x="554" y="302" width="150" height="68" rx="14" fill="#f4efff"/><text x="572" y="327" font-size="13" fill="#64708a">电子抽取</text><text x="572" y="354" font-size="22" font-weight="700" fill="#705bd0">135 fs</text><rect x="726" y="302" width="150" height="68" rx="14" fill="#f4efff"/><text x="744" y="327" font-size="13" fill="#64708a">空穴抽取</text><text x="744" y="354" font-size="22" font-weight="700" fill="#705bd0">90 fs</text><text x="554" y="405" font-size="13" fill="#64708a">较慢但不对称更强 → 净瞬态电流反而更大</text></g><text x="54" y="470" font-family="Arial,sans-serif" font-size="13" fill="#64708a">注意：该对比支持“形貌—动力学”相关性，但不能单独排除转移残留、掺杂与局部接触势差等共同变量。</text></svg>
