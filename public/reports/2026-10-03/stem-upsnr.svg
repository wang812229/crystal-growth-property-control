<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" role="img" aria-labelledby="title desc"><title id="title">iPS 球晶 4D-STEM 实测去噪 uPSNR</title><desc id="desc">作者公开预印本 Table 1：高斯滤波 37.49±0.52 dB、2D-SSD 50.56±3.45 dB、4D-SSD 50.74±3.56 dB。两种 SSD 的均值差 0.18 dB，不足以单独证明 4D 方法优越。</desc><rect width="960" height="470" rx="22" fill="#f4f7ff"/><text x="42" y="54" font-family="Arial,sans-serif" font-size="25" fill="#16264e">低剂量 iPS 球晶：实测 4D-STEM 去噪比较</text><text x="42" y="84" font-family="Arial,sans-serif" font-size="15" fill="#40547d">uPSNR / dB；公开作者稿 Table 1 数值原创重绘，并非论文原图</text><g stroke="#b8c8e7" stroke-width="1"><line x1="135" y1="365" x2="875" y2="365"/><line x1="135" y1="300" x2="875" y2="300"/><line x1="135" y1="235" x2="875" y2="235"/><line x1="135" y1="170" x2="875" y2="170"/><line x1="135" y1="105" x2="875" y2="105"/></g><g font-family="Arial,sans-serif" fill="#4c5f84" font-size="15" text-anchor="end"><text x="122" y="370">30</text><text x="122" y="305">35</text><text x="122" y="240">40</text><text x="122" y="175">45</text><text x="122" y="110">50</text></g><g fill="#a9c2ff"><rect x="215" y="267" width="150" height="98" rx="8"/></g><g fill="#7799ff"><rect x="455" y="98" width="150" height="267" rx="8"/></g><g fill="#5f86ff"><rect x="695" y="96" width="150" height="269" rx="8"/></g><g font-family="Arial,sans-serif" font-size="20" fill="#192c5a" text-anchor="middle"><text x="290" y="253">37.49 ± 0.52</text><text x="530" y="84">50.56 ± 3.45</text><text x="770" y="82">50.74 ± 3.56</text><text x="290" y="398">高斯滤波</text><text x="530" y="398">2D-SSD</text><text x="770" y="398">4D-SSD</text></g><text x="43" y="443" font-family="Arial,sans-serif" font-size="14" fill="#40547d">解释：SSD 相比高斯明显提高；4D 与 2D 均值仅差 0.18 dB，需看 Fig.5 的取向重建而非只看去噪分数。</text></svg>