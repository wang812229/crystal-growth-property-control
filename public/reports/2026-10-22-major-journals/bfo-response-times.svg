<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="BiFeO₃的两个结构通道具有不同拟合时间尺度"><rect width="960" height="540" fill="#f6f8f4"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="42" font-size="24" fill="#253d39" text-anchor="start">BiFeO₃的两个结构通道具有不同拟合时间尺度</text><text x="100" y="100" font-size="18" fill="#253d39" text-anchor="start">未施加应变；44个Bragg峰联合拟合的响应时间 (ps)</text><path d="M240 145V365" stroke="#d7dfd8"/><text x="240" y="400" font-size="16" fill="#253d39" text-anchor="middle">0</text><path d="M390.0 145V365" stroke="#d7dfd8"/><text x="390.0" y="400" font-size="16" fill="#253d39" text-anchor="middle">0.5</text><path d="M540 145V365" stroke="#d7dfd8"/><text x="540" y="400" font-size="16" fill="#253d39" text-anchor="middle">1</text><path d="M690.0 145V365" stroke="#d7dfd8"/><text x="690.0" y="400" font-size="16" fill="#253d39" text-anchor="middle">1.5</text><path d="M840 145V365" stroke="#d7dfd8"/><text x="840" y="400" font-size="16" fill="#253d39" text-anchor="middle">2</text><text x="200" y="216" font-size="19" fill="#253d39" text-anchor="end">FE位移</text><path d="M294.0 210H348.0M294.0 198v24M348.0 198v24" stroke="#176b61" stroke-width="3"/><circle cx="321.0" cy="210" r="8" fill="#176b61"/><text x="363.0" y="216" font-size="18" fill="#253d39" text-anchor="start">0.27 ± 0.09</text><text x="200" y="321" font-size="19" fill="#253d39" text-anchor="end">AFD旋转</text><path d="M420.0 315H720.0M420.0 303v24M720.0 303v24" stroke="#176b61" stroke-width="3"/><circle cx="570.0" cy="315" r="8" fill="#176b61"/><text x="735.0" y="321" font-size="18" fill="#253d39" text-anchor="start">1.1 ± 0.5</text><text x="100" y="449" font-size="16" fill="#253d39" text-anchor="start">误差线：拟合1 s.d.；结构AFD不等同于直接测得磁矩动力学。</text><text x="42" y="503" font-size="15" fill="#253d39" text-anchor="start">根据论文公开数值重绘，并非论文原图；不由曲线外推未测区间。</text></g></svg>