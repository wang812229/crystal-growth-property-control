<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" role="img" aria-label="更低重复波动，不等于更高结构准确度"><rect width="1050" height="560" fill="#f6f3ec"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#173c31"><text x="35" y="45" font-size="27" font-weight="bold">更低重复波动，不等于更高结构准确度</text><text x="35" y="82" font-size="17">根据论文信息重绘，并非论文原图 · 仅重绘明确报告的数值</text><line x1="280" x2="280" y1="130" y2="310" stroke="#d4dbd5"/><text x="280" y="340" text-anchor="middle" font-size="17">0</text><line x1="415" x2="415" y1="130" y2="310" stroke="#d4dbd5"/><text x="415" y="340" text-anchor="middle" font-size="17">0.000802</text><line x1="550" x2="550" y1="130" y2="310" stroke="#d4dbd5"/><text x="550" y="340" text-anchor="middle" font-size="17">0.0016</text><line x1="685" x2="685" y1="130" y2="310" stroke="#d4dbd5"/><text x="685" y="340" text-anchor="middle" font-size="17">0.00241</text><line x1="820" x2="820" y1="130" y2="310" stroke="#d4dbd5"/><text x="820" y="340" text-anchor="middle" font-size="17">0.00321</text><line x1="955" x2="955" y1="130" y2="310" stroke="#d4dbd5"/><text x="955" y="340" text-anchor="middle" font-size="17">0.00401</text><text x="260" y="176" text-anchor="end" font-size="19">逐帧模型</text><rect x="280" y="150" width="572.0338983050847" height="42" fill="#286c59"/><text x="862.0338983050847" y="177" font-size="19">0.0034</text><text x="260" y="266" text-anchor="end" font-size="19">联合共享模型</text><rect x="280" y="240" width="180.0224327018943" height="42" fill="#ba6c37"/><text x="470.02243270189433" y="267" font-size="19">0.00107</text><text x="620" y="375" text-anchor="middle" font-size="18">RMS of repeat standard deviations (Å)</text><text x="35" y="416" font-size="17">来源：diffPXRD图3c；NCA原位谱，10%计数、20次二项抽稀。</text><text x="35" y="445" font-size="17">(0.00340−0.00107)/0.00340≈68.5%；论文按未舍入值报68.4%。</text><text x="35" y="474" font-size="17">不是相对真值误差，不含共享模型偏差；本轮未独立执行抽稀精修。</text></g></svg>