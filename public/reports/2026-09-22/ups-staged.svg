<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">UPS分阶段磁序、5f重构与异常Hall</title><desc id="d">118 K磁序、约90 K谱重重排和80到90 K异常Hall宽峰的原创时间轴。</desc><defs><linearGradient id="g" x2="1"><stop stop-color="#5f86ff"/><stop offset="1" stop-color="#9a76ee"/></linearGradient></defs><rect width="1200" height="630" rx="34" fill="#f1f4ff"/><text x="58" y="70" font-family="Arial" font-size="28" font-weight="700" fill="#243457">UPS · 磁性、相关谱重与拓扑输运分阶段涌现</text><text x="58" y="106" font-family="Arial" font-size="16" fill="#68799a">依据 arXiv:2609.24897v1 公开数据重绘</text><line x1="100" y1="315" x2="1100" y2="315" stroke="url(#g)" stroke-width="10" stroke-linecap="round"/><g font-family="Arial"><g transform="translate(270 315)"><circle r="34" fill="#5f86ff"/><line y1="-34" y2="-125" stroke="#5f86ff" stroke-width="3"/><text x="0" y="-150" text-anchor="middle" font-size="28" font-weight="700" fill="#344866">118 K</text><text x="0" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#4768cc">铁磁长程序</text><text x="0" y="104" text-anchor="middle" font-size="16" fill="#68799a">χ(T), Cₚ, ρ(T)</text></g><g transform="translate(590 315)"><circle r="34" fill="#7e7feb"/><line y1="-34" y2="-125" stroke="#7e7feb" stroke-width="3"/><text x="0" y="-150" text-anchor="middle" font-size="28" font-weight="700" fill="#344866">≈ 90 K</text><text x="0" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#6656c9">低能5f谱重重排</text><text x="0" y="104" text-anchor="middle" font-size="16" fill="#68799a">共振ARPES</text></g><g transform="translate(900 315)"><circle r="34" fill="#9a76ee"/><line y1="-34" y2="-125" stroke="#9a76ee" stroke-width="3"/><text x="0" y="-150" text-anchor="middle" font-size="28" font-weight="700" fill="#344866">80–90 K</text><text x="0" y="72" text-anchor="middle" font-size="21" font-weight="700" fill="#7253c9">异常Hall宽峰</text><text x="0" y="104" text-anchor="middle" font-size="16" fill="#68799a">σᴀʜ ≈ 4.5×10² Ω⁻¹cm⁻¹</text></g><rect x="120" y="500" width="960" height="70" rx="18" fill="#fff" stroke="#d4def5"/><text x="600" y="530" text-anchor="middle" font-size="17" fill="#4d6181">磁化、Hall与5f相干性不共享单一温标 → 排除“异常Hall只按 Mₛ 缩放”的充分解释</text><text x="600" y="555" text-anchor="middle" font-size="15" fill="#7a889f">计算AHC≈9.6×10² Ω⁻¹cm⁻¹同量级但非定量吻合；Weyl归属仍需调Eꜰ验证</text></g></svg>
