<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="t d"><title id="t">NbN thickness and Dynes electrodynamics map</title><desc id="d">Original chart linking NbN film thickness to transition temperature, gap and penetration depth, plus the subgap absorption at Delta.</desc><rect width="1200" height="560" rx="38" fill="#f4f1e9"/><text x="60" y="70" fill="#143a3f" font-family="Arial,sans-serif" font-size="30" font-weight="700">NbN thickness series · where BCS starts to miss the data</text><line x1="80" y1="430" x2="660" y2="430" stroke="#8ba09b" stroke-width="2"/><line x1="80" y1="130" x2="80" y2="430" stroke="#8ba09b" stroke-width="2"/><g fill="#143a3f" font-family="Arial,sans-serif" font-size="16"><text x="62" y="458">4.5</text><text x="184" y="458">5</text><text x="302" y="458">7.5</text><text x="426" y="458">10</text><text x="548" y="458">20 nm</text><text x="20" y="164">13 K</text><text x="20" y="415">8 K</text></g><polyline points="80,396 202,333 324,229 446,185 568,162" fill="none" stroke="#d84f3f" stroke-width="7"/><g fill="#d84f3f"><circle cx="80" cy="396" r="10"/><circle cx="202" cy="333" r="10"/><circle cx="324" cy="229" r="10"/><circle cx="446" cy="185" r="10"/><circle cx="568" cy="162" r="10"/></g><text x="350" y="130" fill="#d84f3f" font-family="Arial,sans-serif" font-size="19" font-weight="700">T₍c₎: 8.49 → 13.34 K</text><text x="350" y="162" fill="#526b6e" font-family="Arial,sans-serif" font-size="17">2Δ₀: 2.50 → 4.65 meV · λL: 848 → 443 nm</text><rect x="720" y="112" width="420" height="330" rx="28" fill="#0d2930"/><text x="754" y="160" fill="#77dec5" font-family="Arial,sans-serif" font-size="20" font-weight="700">20 nm FILM · THz EVIDENCE</text><path d="M760 350C800 345 825 330 850 300S905 276 930 244 980 226 1005 216 1060 180 1090 175" fill="none" stroke="#ffb453" stroke-width="7"/><line x1="880" y1="205" x2="880" y2="380" stroke="#e46f55" stroke-width="4" stroke-dasharray="10 9"/><line x1="1010" y1="205" x2="1010" y2="380" stroke="#77dec5" stroke-width="4" stroke-dasharray="10 9"/><text x="838" y="405" fill="#ffb6a1" font-family="Arial,sans-serif" font-size="18" font-weight="700">Δ₀ step</text><text x="990" y="405" fill="#a9efe0" font-family="Arial,sans-serif" font-size="18" font-weight="700">2Δ₀ edge</text><text x="754" y="205" fill="#fff" font-family="Arial,sans-serif" font-size="24" font-weight="700">Γ ≈ 0.036 Δ₀</text><text x="754" y="236" fill="#b7c8c5" font-family="Arial,sans-serif" font-size="16">same value fits TDS and FDS</text><text x="60" y="510" fill="#667b78" font-family="Arial,sans-serif" font-size="16">Original redraw from Table I and the Dynes/BCS comparison; not a paper figure.</text></svg>
