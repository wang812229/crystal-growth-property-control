<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420"><rect width="960" height="420" rx="28" fill="#f5f7ff"/><text x="55" y="55" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#15213b">FePS₃/graphene 电阻中的四个温标</text><line x1="90" y1="260" x2="900" y2="260" stroke="#b7c8f8" stroke-width="5"/><g font-family="Arial" text-anchor="middle"><circle cx="220" cy="260" r="14" fill="#5f86ff"/><text x="220" y="225" font-size="19" fill="#253555">F1 ≈20 K</text><text x="220" y="295" font-size="15" fill="#64708a">低温钉扎/冻结候选</text><circle cx="390" cy="260" r="14" fill="#7b5de8"/><text x="390" y="205" font-size="19" fill="#253555">F2 = 42.5±0.8 K</text><text x="390" y="230" font-size="15" fill="#64708a">14 T → ≈50 K</text><text x="390" y="295" font-size="15" fill="#64708a">zigzag重排候选</text><circle cx="550" cy="260" r="14" fill="#42a7a1"/><text x="550" y="225" font-size="19" fill="#253555">F3 ≈60 K</text><text x="550" y="295" font-size="15" fill="#64708a">magnon候选</text><circle cx="790" cy="260" r="14" fill="#ef6f91"/><text x="790" y="225" font-size="19" fill="#253555">F4 ≈117 K</text><text x="790" y="295" font-size="15" fill="#64708a">Néel转变</text></g><text x="90" y="365" font-family="Arial" font-size="15" fill="#64708a">根据 arXiv:2609.16725 图2与正文数值重绘；圆点位置仅表示温度次序，不复制原始电阻曲线。</text></svg>