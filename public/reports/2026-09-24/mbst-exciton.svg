<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">MnBi1.7Sb0.3Te4单晶生长和时间分辨ARPES证据链</title><desc id="d">根据论文Methods和公开数值重绘，不是论文原图。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#f6f1ff"/></linearGradient><linearGradient id="bar" x2="1"><stop stop-color="#ffb46a"/><stop offset=".45" stop-color="#ff746a"/><stop offset="1" stop-color="#5f86ff"/></linearGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><g font-family="Arial,'Microsoft YaHei'"><text x="65" y="78" font-size="34" font-weight="700" fill="#17233d">从助熔剂单晶到微秒级光生低能态</text><text x="65" y="116" font-size="18" fill="#56647c">MnBi₁.₇Sb₀.₃Te₄ · 根据Methods与公开数值重绘</text><rect x="70" y="165" width="460" height="420" rx="24" fill="white" stroke="#c9d8ff"/><text x="100" y="212" font-size="23" font-weight="700" fill="#315dcc">生长温程</text><rect x="110" y="270" width="350" height="32" rx="16" fill="url(#bar)"/><circle cx="145" cy="286" r="10" fill="#b4492f"/><circle cx="430" cy="286" r="10" fill="#315dcc"/><text x="145" y="250" text-anchor="middle" font-size="18" fill="#6c3828">900 °C</text><text x="430" y="250" text-anchor="middle" font-size="18" fill="#315dcc">601 °C</text><text x="285" y="335" text-anchor="middle" font-size="17" fill="#37455d">真空石英管 · 缓慢降温</text><path d="M285 355v70" stroke="#7c8bab" stroke-width="4"/><path d="M275 415l10 16 10-16" fill="#7c8bab"/><text x="285" y="465" text-anchor="middle" font-size="18" font-weight="700" fill="#17233d">倾斜安瓿移除助熔剂</text><text x="285" y="505" text-anchor="middle" font-size="16" fill="#65738a">配比 / 降温速率 / 产率：正文未完整报告</text><rect x="575" y="165" width="555" height="420" rx="24" fill="#17233d"/><text x="610" y="212" font-size="23" font-weight="700" fill="white">trARPES 与判据</text><text x="610" y="262" font-size="17" fill="#d6def5">250 kHz · 泵浦 1.55 eV · 探测 6.2 eV</text><text x="610" y="297" font-size="17" fill="#d6def5">20–120 μJ cm⁻² · Δt &lt; 200 fs · ΔE = 50 meV</text><line x1="630" y1="390" x2="1065" y2="390" stroke="#73809d" stroke-width="3"/><line x1="630" y1="390" x2="630" y2="330" stroke="#73809d" stroke-width="3"/><path d="M640 372C700 360 730 340 780 345S860 360 905 322S990 300 1055 286" fill="none" stroke="#7ea0ff" stroke-width="6"/><circle cx="780" cy="345" r="8" fill="#ffd36a"/><text x="780" y="425" text-anchor="middle" font-size="16" fill="#d6def5">延迟建立</text><text x="1005" y="265" font-size="16" fill="#d6def5">微秒寿命</text><text x="610" y="478" font-size="18" font-weight="700" fill="#ffe09c">支持：</text><text x="680" y="478" font-size="17" fill="#e6ebfa">110 K 双峰 EDC / Mexican-hat</text><text x="610" y="515" font-size="18" font-weight="700" fill="#ffe09c">对照：</text><text x="680" y="515" font-size="17" fill="#e6ebfa">300 K 单峰；BVB 基本不动</text><text x="70" y="634" font-size="17" fill="#506079">BVB稳定削弱整体表面光电压解释，但尚不能独立证明宏观相干；需变重复频率、THz集体模与终止面对照。</text></g></svg>
