<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-label="冷冲击提高的是筛选后的片源面积与堆垛比例"><rect width="960" height="540" fill="#f6f8f4"/><g font-family="Arial,Microsoft YaHei,sans-serif"><text x="42" y="42" font-size="24" fill="#253d39" text-anchor="start">冷冲击提高的是筛选后的片源面积与堆垛比例</text><text x="90" y="102" font-size="18" fill="#253d39" text-anchor="start">作者汇总片面积 (μm²)</text><path d="M90 413h300" stroke="#d7dfd8"/><text x="82" y="418" font-size="14" fill="#253d39" text-anchor="end">0</text><path d="M90 350.5h300" stroke="#d7dfd8"/><text x="82" y="355.5" font-size="14" fill="#253d39" text-anchor="end">875</text><path d="M90 288.0h300" stroke="#d7dfd8"/><text x="82" y="293.0" font-size="14" fill="#253d39" text-anchor="end">1750</text><path d="M90 225.5h300" stroke="#d7dfd8"/><text x="82" y="230.5" font-size="14" fill="#253d39" text-anchor="end">2625</text><path d="M90 163h300" stroke="#d7dfd8"/><text x="82" y="168" font-size="14" fill="#253d39" text-anchor="end">3500</text><rect x="136" y="327.2857142857143" width="76" height="85.71428571428571" fill="#8eaaa0"/><text x="174" y="315.2857142857143" font-size="18" fill="#253d39" text-anchor="middle">1200</text><text x="174" y="443" font-size="16" fill="#253d39" text-anchor="middle">标准剥离</text><rect x="276" y="191.57142857142858" width="76" height="221.42857142857142" fill="#176b61"/><text x="314" y="179.57142857142858" font-size="18" fill="#253d39" text-anchor="middle">3100</text><text x="314" y="443" font-size="16" fill="#253d39" text-anchor="middle">冷冲击</text><text x="560" y="102" font-size="18" fill="#253d39" text-anchor="start">非Bernal面积比例 (%)</text><path d="M560 413h300" stroke="#d7dfd8"/><text x="552" y="418" font-size="14" fill="#253d39" text-anchor="end">0</text><path d="M560 350.5h300" stroke="#d7dfd8"/><text x="552" y="355.5" font-size="14" fill="#253d39" text-anchor="end">10</text><path d="M560 288.0h300" stroke="#d7dfd8"/><text x="552" y="293.0" font-size="14" fill="#253d39" text-anchor="end">20</text><path d="M560 225.5h300" stroke="#d7dfd8"/><text x="552" y="230.5" font-size="14" fill="#253d39" text-anchor="end">30</text><path d="M560 163h300" stroke="#d7dfd8"/><text x="552" y="168" font-size="14" fill="#253d39" text-anchor="end">40</text><rect x="606" y="338.0" width="76" height="75.0" fill="#8eaaa0"/><text x="644" y="326.0" font-size="18" fill="#253d39" text-anchor="middle">12</text><text x="644" y="443" font-size="16" fill="#253d39" text-anchor="middle">标准剥离</text><rect x="746" y="213.0" width="76" height="200.0" fill="#176b61"/><text x="784" y="201.0" font-size="18" fill="#253d39" text-anchor="middle">32</text><text x="784" y="443" font-size="16" fill="#253d39" text-anchor="middle">冷冲击</text><text x="90" y="477" font-size="15" fill="#253d39" text-anchor="start">相同衬底面积、指定层数与排除规则；不是所有原始片的平均或转化率。</text><text x="42" y="503" font-size="15" fill="#253d39" text-anchor="start">根据论文公开数值重绘，并非论文原图；不由曲线外推未测区间。</text></g></svg>