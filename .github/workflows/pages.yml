name: 发布每日文献简报

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 获取网站源码
        uses: actions/checkout@v6

      - name: 安装 Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: 安装 pnpm
        run: npm install --global pnpm@10

      - name: 安装网站依赖
        run: pnpm install --frozen-lockfile

      - name: 检索功能测试
        run: pnpm test

      - name: 生成静态网页
        run: pnpm build:pages

      - name: 检查静态索引与链接
        run: node --test tests/pages.integration.mjs

      - name: 配置 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 上传网页文件
        uses: actions/upload-pages-artifact@v5
        with:
          path: github-dist

      - name: 发布 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
