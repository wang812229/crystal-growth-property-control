<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" role="img" aria-label="声学等离激元模型与RIXS特征能标比较"><rect width="1000" height="580" fill="#f7f5ef"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#173c31"><text x="35" y="42" font-size="25" font-weight="bold">线性色散不能单独证明“声学等离激元”</text><text x="35" y="80" font-size="17">根据论文信息重绘，并非论文原图 · 仅比较SI F中给出的能量范围</text><line x1="270" x2="270" y1="155" y2="335" stroke="#d3d9d2"/><text x="270" y="365" text-anchor="middle" font-size="18">0</text><line x1="370" x2="370" y1="155" y2="335" stroke="#d3d9d2"/><text x="370" y="365" text-anchor="middle" font-size="18">100</text><line x1="470" x2="470" y1="155" y2="335" stroke="#d3d9d2"/><text x="470" y="365" text-anchor="middle" font-size="18">200</text><line x1="570" x2="570" y1="155" y2="335" stroke="#d3d9d2"/><text x="570" y="365" text-anchor="middle" font-size="18">300</text><line x1="670" x2="670" y1="155" y2="335" stroke="#d3d9d2"/><text x="670" y="365" text-anchor="middle" font-size="18">400</text><line x1="770" x2="770" y1="155" y2="335" stroke="#d3d9d2"/><text x="770" y="365" text-anchor="middle" font-size="18">500</text><line x1="870" x2="870" y1="155" y2="335" stroke="#d3d9d2"/><text x="870" y="365" text-anchor="middle" font-size="18">600</text><text x="245" y="208" text-anchor="end" font-size="17">声学等离激元（模型）</text><rect x="360" y="180" width="90" height="42" fill="#ba6d35"/><text x="405" y="165" text-anchor="middle" font-size="19">90–180 meV</text><text x="245" y="300" text-anchor="end" font-size="17">讨论的RIXS特征</text><rect x="670" y="270" width="100" height="42" fill="#286c59"/><text x="720" y="255" text-anchor="middle" font-size="19">约400–500 meV</text><text x="570" y="402" text-anchor="middle" font-size="18">Energy transfer (meV)</text><text x="35" y="450" font-size="16">来源：MgB₂论文SI F、S11；两行不是同一q点的两个实测峰。</text><text x="35" y="477" font-size="16">支持：该几何下模型声学等离激元能标不足以解释所讨论特征。</text><text x="35" y="504" font-size="16">不能证明：所有几何均无声学等离激元，或凭此图单独确认带内连续谱。</text><text 