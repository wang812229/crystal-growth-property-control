<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" role="img" aria-label="有择优取向，不等于完全共格外延"><rect width="1050" height="560" fill="#f6f3ec"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#173c31"><text x="35" y="45" font-size="27" font-weight="bold">有择优取向，不等于完全共格外延</text><text x="35" y="82" font-size="17">根据论文信息重绘，并非论文原图 · 仅重绘明确报告的数值</text><line x1="280" x2="280" y1="130" y2="310" stroke="#d4dbd5"/><text x="280" y="340" text-anchor="middle" font-size="17">0</text><line x1="415" x2="415" y1="130" y2="310" stroke="#d4dbd5"/><text x="415" y="340" text-anchor="middle" font-size="17">4.3</text><line x1="550" x2="550" y1="130" y2="310" stroke="#d4dbd5"/><text x="550" y="340" text-anchor="middle" font-size="17">8.59</text><line x1="685" x2="685" y1="130" y2="310" stroke="#d4dbd5"/><text x="685" y="340" text-anchor="middle" font-size="17">12.9</text><line x1="820" x2="820" y1="130" y2="310" stroke="#d4dbd5"/><text x="820" y="340" text-anchor="middle" font-size="17">17.2</text><line x1="955" x2="955" y1="130" y2="310" stroke="#d4dbd5"/><text x="955" y="340" text-anchor="middle" font-size="17">21.5</text><text x="260" y="176" text-anchor="end" font-size="19">面内方位 FWHM</text><rect x="280" y="150" width="106.86347550754331" height="42" fill="#286c59"/><text x="396.8634755075433" y="177" font-size="19">3.4</text><text x="260" y="266" text-anchor="end" font-size="19">面外倾斜偏离</text><rect x="280" y="240" width="572.0338983050847" height="42" fill="#ba6c37"/><text x="862.0338983050847" y="267" font-size="19">18.2</text><text x="620" y="375" text-anchor="middle" font-size="18">Angle (degree)</text><text x="35" y="416" font-size="17">来源：BAs主文图2/取向分析；面外偏离45°−26.84°≈18.2°。</text><text x="35" y="445" font-size="17">两量物理定义不同：一个是分布宽度，一个是平均倾斜，不能相减作应变。</text><text x="35" y="474" font-size="17">不证明无晶界，也不提供热导率；未复制原始衍射曲线。</text></g></svg>