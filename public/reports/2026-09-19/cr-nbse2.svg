<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">Cr intercalation and neutron evidence chain</title><desc id="d">Quantitative redraw of composition and neutron sample conditions</desc><rect width="960" height="420" rx="28" fill="#f4f7ff"/><text x="55" y="60" font-family="Arial" font-size="25" font-weight="700" fill="#17213a">CrₓNbSe₂：名义占位与实测占位必须分开</text><text x="55" y="94" font-family="Arial" font-size="16" fill="#53617c">按公开正文/Methods重绘 · 非论文原图</text><text x="75" y="157" font-family="Arial" font-size="18" fill="#17213a">名义 x = 0.250</text><rect x="260" y="132" width="520" height="34" rx="17" fill="#c6d4ff"/><text x="75" y="224" font-family="Arial" font-size="18" fill="#17213a">EDS x = 0.185 ± 0.01</text><rect x="260" y="199" width="385" height="34" rx="17" fill="#627fff"/><line x1="625" y1="192" x2="665" y2="240" stroke="#324eaa" stroke-width="3"/><text x="700" y="224" font-family="Arial" font-size="17" fill="#324eaa">δ = 0.065</text><rect x="70" y="280" width="390" height="82" rx="18" fill="#fff" stroke="#b5c7ff"/><text x="94" y="312" font-family="Arial" font-size="18" font-weight="700" fill="#24427f">衍射</text><text x="94" y="340" font-family="Arial" font-size="16" fill="#53617c">10 mg单晶 · 2.3 K · 约5 mT导向场</text><rect x="500" y="280" width="390" height="82" rx="18" fill="#fff" stroke="#b5c7ff"/><text x="524" y="312" font-family="Arial" font-size="18" font-weight="700" fill="#24427f">非弹性谱</text><text x="524" y="340" font-family="Arial" font-size="16" fill="#53617c">10片共1.4 g · Ei 15 meV · 5.5%分辨</text><text x="70" y="400" font-family="Arial" font-size="15" fill="#53617c">占位固定进入中子精修；条长按x线性绘制。</text></svg>
