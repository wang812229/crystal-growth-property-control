<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">MoS₂ 纳米带三温区 CVD 参数</title><desc id="d">硫源210摄氏度，氧化钼源600升至640摄氏度，衬底1110摄氏度，氩气300标准立方厘米每分钟。依据 arXiv 2610.00987 Methods 原创重绘。</desc><rect width="960" height="400" rx="22" fill="#f5f7ff"/><text x="45" y="55" font-size="25" font-family="Arial,sans-serif" fill="#15264b">MoS₂ 纳米带：三个温区不可混为一谈</text><text x="45" y="85" font-size="14" fill="#4a5d83" font-family="Arial,sans-serif">常压 CVD / 26 mm 石英管 / Ar 300 sccm；非论文原图</text><line x1="125" y1="312" x2="880" y2="312" stroke="#7189b6" stroke-width="2"/><text x="55" y="325" font-size="14" fill="#4a5d83" font-family="Arial,sans-serif">0 °C</text><text x="865" y="337" font-size="14" fill="#4a5d83" font-family="Arial,sans-serif">1150 °C</text><g font-family="Arial,sans-serif" fill="#15264b"><text x="53" y="146" font-size="18">硫源</text><rect x="125" y="123" width="137" height="32" rx="8" fill="#a9c2ff"/><text x="270" y="146" font-size="17">210 °C · S 120 mg</text><text x="53" y="212" font-size="18">MoO₃ 源</text><rect x="125" y="188" width="419" height="32" rx="8" fill="#8ba8ff"/><text x="555" y="212" font-size="17">600→640 °C · 14 mg</text><text x="53" y="277" font-size="18">a 面蓝宝石</text><rect x="125" y="253" width="729" height="32" rx="8" fill="#5f86ff"/><text x="690" y="278" font-size="17" fill="white">1110 °C</text></g><text x="55" y="370" font-size="14" fill="#4a5d83" font-family="Arial,sans-serif">MoO₃ 源在 640 °C 保温 10–20 min 的时间序列对应双层覆盖率增长；不代表同一条带的原位影像。</text></svg>