<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" role="img" aria-label="Mn₅Si₃：侧壁清洗前后的可辨信号器件比例"><rect width="940" height="470" fill="#f4f9fc"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#15344b"><text x="25" y="38" font-size="23" font-weight="bold">Mn₅Si₃：侧壁清洗前后的可辨信号器件比例</text><text x="25" y="75" font-size="16">可辨非局域自旋信号器件占比（%）· 非随机分批实验</text><path d="M90 300H850" stroke="#c9d9e4"/><text x="30" y="305" font-size="16">0</text><path d="M90 250H850" stroke="#c9d9e4"/><text x="30" y="255" font-size="16">25</text><path d="M90 200H850" stroke="#c9d9e4"/><text x="30" y="205" font-size="16">50</text><path d="M90 150H850" stroke="#c9d9e4"/><text x="30" y="155" font-size="16">75</text><path d="M90 100H850" stroke="#c9d9e4"/><text x="30" y="105" font-size="16">100</text><rect x="215.0" y="283.3333333333333" width="130" height="16.666666666666686" fill="#227e9c"/><text x="280.0" y="268.3333333333333" text-anchor="middle" font-size="19">8.3%</text><text x="280.0" y="335" text-anchor="middle" font-size="18">未清侧壁：1 / 12</text><rect x="595.0" y="140.0" width="130" height="160.0" fill="#227e9c"/><text x="660.0" y="125.0" text-anchor="middle" font-size="19">80.0%</text><text x="660.0" y="335" text-anchor="middle" font-size="18">清洗侧壁：8 / 10</text><text x="25" y="385" font-size="16">根据论文信息重绘，并非论文原图；来源：正式SI图S10。</text><text x="25" y="417" font-size="15">仅按1/12和8/10计数作图；无原文误差条，不代表零不确定度。</text><text x="25" y="448" font-size="15">支持侧壁接触重要性，不能给出普适80%成功率或唯一磁序证明。</text></g></svg>