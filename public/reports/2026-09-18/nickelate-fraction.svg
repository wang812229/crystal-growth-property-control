<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-label="镍酸盐两种样品超导体积分数和转变温度">
<rect width="900" height="390" rx="24" fill="#f6f8ff"/><text x="40" y="55" font-size="25" font-family="Arial,sans-serif" font-weight="700" fill="#26385d">常压镍酸盐：转变温度 ≠ 体超导占比</text><text x="40" y="82" font-size="14" font-family="Arial,sans-serif" fill="#64769c">根据 arXiv:2609.19686 公开数值重绘 · 并非论文原图</text><text x="60" y="130" font-size="16" fill="#617397">估计超导体积分数（并列显示，条长不代表比例）</text><path d="M240 155H805M240 245H805" stroke="#cfdbf4" stroke-width="2"/><text x="55" y="185" font-size="18" fill="#26385d">Pr 掺杂样</text><text x="55" y="275" font-size="18" fill="#26385d">Y 掺杂样</text><rect x="240" y="159" width="500" height="46" rx="9" fill="#5f86ff"/><rect x="240" y="249" width="500" height="46" rx="9" fill="#a9c2ff"/><text x="260" y="188" font-size="19" font-weight="700" fill="#26385d">约 2% · Tc ≈ 7 K</text><text x="260" y="278" font-size="19" font-weight="700" fill="#26385d">约 0.03% · Tc ≈ 15 K</text><text x="55" y="350" font-size="15" fill="#7c5172">体积分数均很低；较高 Tc 不等于均匀块体超导已被证明。</text>
</svg>
