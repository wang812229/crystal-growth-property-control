<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="Au纳米晶连续生长与取向附着示意">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f7f9ff"/><stop offset="1" stop-color="#edf2ff"/></linearGradient><linearGradient id="g" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#5F86FF"/><stop offset="1" stop-color="#9B7BFF"/></linearGradient></defs>
<rect width="1200" height="650" rx="28" fill="url(#b)"/><text x="70" y="72" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#15213b">Au 液相纳米晶：群体平均相同，微观路径不同</text>
<text x="70" y="112" font-family="Arial,sans-serif" font-size="18" fill="#61708f">1 mM HAuCl₄ · 80 nm 液池 · 1.14 e⁻ Å⁻² s⁻¹ · 5DSTEM</text>
<rect x="65" y="150" width="500" height="400" rx="22" fill="#fff" stroke="#cad7ff"/><text x="95" y="195" font-family="Arial" font-size="23" font-weight="700" fill="#24469b">连续生长｜n=20，平均 R²=0.97</text>
<path d="M115 480 L470 480 M115 480 L115 245" stroke="#9aa9c4" stroke-width="2"/><path d="M125 455 C220 420 300 350 450 270" fill="none" stroke="#5F86FF" stroke-width="8" stroke-linecap="round"/><circle cx="165" cy="440" r="22" fill="#f2c94c"/><circle cx="280" cy="380" r="35" fill="#f2c94c"/><circle cx="430" cy="285" r="52" fill="#f2c94c"/><text x="165" y="520" font-family="Arial" font-size="17" fill="#61708f">投影面积近线性增加：表面反应受限</text>
<rect x="635" y="150" width="500" height="400" rx="22" fill="#fff" stroke="#d8ceff"/><text x="665" y="195" font-family="Arial" font-size="23" font-weight="700" fill="#643fa8">取向附着｜n=10，分段 R²=0.95</text>
<path d="M685 480 L1040 480 M685 480 L685 245" stroke="#9aa9c4" stroke-width="2"/><path d="M695 450 L820 410 L825 330 L1025 255" fill="none" stroke="url(#g)" stroke-width="8" stroke-linejoin="round"/><circle cx="780" cy="420" r="30" fill="#f2c94c"/><circle cx="850" cy="390" r="27" fill="#ffcf75"/><path d="M815 405 L842 397" stroke="#8b5cf6" stroke-width="5" marker-end="url(#none)"/><circle cx="895" cy="315" r="48" fill="#e9b73b"/><text x="725" y="520" font-family="Arial" font-size="17" fill="#61708f">面积突跳 + 取向突变 + 界面应变</text>
<rect x="260" y="575" width="680" height="44" rx="22" fill="#e8eeff"/><text x="600" y="603" text-anchor="middle" font-family="Arial" font-size="18" fill="#33466f">拉伸应变最高约 3%，从表面 / 并合界面向内部发展</text>
</svg>
