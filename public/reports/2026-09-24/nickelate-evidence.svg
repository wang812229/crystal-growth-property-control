<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d">
<title id="t">双层镍酸盐的氧调控、层间杂化与超导证据链</title><desc id="d">根据论文补充材料重绘的定性证据链，不是论文原图。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eef4ff"/><stop offset="1" stop-color="#f5f0ff"/></linearGradient><linearGradient id="g" x2="1"><stop stop-color="#5f86ff"/><stop offset="1" stop-color="#8f6cf6"/></linearGradient></defs>
<rect width="1200" height="680" rx="36" fill="url(#bg)"/><text x="70" y="82" font-family="Arial,'Microsoft YaHei'" font-size="34" font-weight="700" fill="#14213d">氧处理把层间杂化变成超导的控制轴</text><text x="70" y="120" font-family="Arial,'Microsoft YaHei'" font-size="18" fill="#53627a">根据正文摘要与 Supplementary Notes / Figs. S1–S12 重绘 · 定性示意</text>
<g font-family="Arial,'Microsoft YaHei'">
<rect x="70" y="180" width="300" height="280" rx="24" fill="white" stroke="#c9d8ff"/><text x="100" y="225" font-size="23" font-weight="700" fill="#315dcc">样品与对照</text><rect x="105" y="270" width="230" height="38" rx="14" fill="#dfe9ff"/><text x="220" y="296" text-anchor="middle" font-size="18" fill="#22345a">≈1 nm 非晶 PBCO 封帽</text><rect x="105" y="326" width="230" height="64" rx="14" fill="url(#g)"/><text x="220" y="353" text-anchor="middle" font-size="19" font-weight="700" fill="white">La₃Ni₂O₇₋δ</text><text x="220" y="378" text-anchor="middle" font-size="15" fill="white">双层 NiO₂ 活性层</text><rect x="105" y="408" width="230" height="30" rx="12" fill="#cbd4e6"/><text x="220" y="429" text-anchor="middle" font-size="15" fill="#26364f">SLAO 基底</text>
<path d="M390 320h100" stroke="#7798ff" stroke-width="5" marker-end="url(#a)"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7798ff"/></marker></defs>
<rect x="500" y="180" width="300" height="280" rx="24" fill="white" stroke="#c9d8ff"/><text x="530" y="225" font-size="23" font-weight="700" fill="#315dcc">多探针同向变化</text><text x="535" y="278" font-size="18" fill="#253651">O K-edge 角分辨 XAS</text><text x="535" y="320" font-size="18" fill="#253651">Ni L-edge / RIXS 磁激发</text><text x="535" y="362" font-size="18" fill="#253651">RSM / 结构相干性</text><text x="535" y="404" font-size="18" fill="#253651">R(T) / Hall / 超导转变</text>
<path d="M820 320h100" stroke="#8f6cf6" stroke-width="5" marker-end="url(#b)"/><defs><marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8f6cf6"/></marker></defs>
<rect x="930" y="180" width="200" height="280" rx="24" fill="#182542"/><text x="1030" y="225" text-anchor="middle" font-size="22" font-weight="700" fill="white">物理判断</text><text x="1030" y="284" text-anchor="middle" font-size="18" fill="#cfd9ff">层间相干增强</text><text x="1030" y="329" text-anchor="middle" font-size="28" font-weight="700" fill="#9eb6ff">→ 超导</text><text x="1030" y="382" text-anchor="middle" font-size="15" fill="#d7dcf2">不是“载流子数”</text><text x="1030" y="406" text-anchor="middle" font-size="15" fill="#d7dcf2">单变量叙事</text>
<rect x="70" y="520" width="1060" height="95" rx="22" fill="#fff7e6" stroke="#f5cb77"/><text x="100" y="557" font-size="19" font-weight="700" fill="#825400">这张图支持什么</text><text x="100" y="588" font-size="17" fill="#594924">谱学、结构与输运沿同一氧调控序列共变，封帽对照削弱了“PBCO自身导电”的解释。</text><text x="700" y="557" font-size="19" font-weight="700" fill="#825400">不能证明什么</text><text x="700" y="588" font-size="17" fill="#594924">尚不能把氧空位、应变与缺陷完全拆分，也不能替代主文Methods中的绝对计量。</text></g></svg>
