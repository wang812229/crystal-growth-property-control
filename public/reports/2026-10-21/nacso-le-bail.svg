<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 560" role="img" aria-label="同一低温谱：放开度量约束可改善拟合"><rect width="1050" height="560" fill="#f6f3ec"/><g font-family="Arial,Microsoft YaHei,sans-serif" fill="#173c31"><text x="35" y="45" font-size="27" font-weight="bold">同一低温谱：放开度量约束可改善拟合</text><text x="35" y="82" font-size="17">根据论文信息重绘，并非论文原图 · 仅重绘明确报告的数值</text><line x1="280" x2="280" y1="130" y2="310" stroke="#d4dbd5"/><text x="280" y="340" text-anchor="middle" font-size="17">0</text><line x1="415" x2="415" y1="130" y2="310" stroke="#d4dbd5"/><text x="415" y="340" text-anchor="middle" font-size="17">4.25</text><line x1="550" x2="550" y1="130" y2="310" stroke="#d4dbd5"/><text x="550" y="340" text-anchor="middle" font-size="17">8.5</text><line x1="685" x2="685" y1="130" y2="310" stroke="#d4dbd5"/><text x="685" y="340" text-anchor="middle" font-size="17">12.7</text><line x1="820" x2="820" y1="130" y2="310" stroke="#d4dbd5"/><text x="820" y="340" text-anchor="middle" font-size="17">17</text><line x1="955" x2="955" y1="130" y2="310" stroke="#d4dbd5"/><text x="955" y="340" text-anchor="middle" font-size="17">21.2</text><text x="260" y="176" text-anchor="end" font-size="19">单斜度量</text><rect x="280" y="150" width="572.0338983050848" height="42" fill="#286c59"/><text x="862.0338983050848" y="177" font-size="19">18</text><text x="260" y="266" text-anchor="end" font-size="19">三斜度量</text><rect x="280" y="240" width="444.91525423728814" height="42" fill="#ba6c37"/><text x="734.9152542372881" y="267" font-size="19">14</text><text x="620" y="375" text-anchor="middle" font-size="18">Rwp (%) · approximately</text><text x="35" y="416" font-size="17">来源：Na₃Co₂SbO₆ SI第8页，同为4.35 K全谱Le Bail。</text><text x="35" y="445" font-size="17">χ²另由约2.1降至1.4；并非原子结构Rietveld，未解全部原子位移。</text><text x="35" y="474" font-size="17">更低Rwp不是唯一证据；需多反射劈裂、温变与应变选畴共同约束。</text></g></svg>