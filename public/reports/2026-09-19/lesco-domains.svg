<svg xmlns="http://www.w3.org/2000/svg" width="960" height="420" viewBox="0 0 960 420" role="img" aria-labelledby="t d"><title id="t">LESCO structure texture scales</title><desc id="d">Quantitative redraw of 300 K and 100 K domain scales</desc><rect width="960" height="420" rx="28" fill="#f4f7ff"/><text x="55" y="58" font-family="Arial,sans-serif" font-size="25" font-weight="700" fill="#17213a">LESCO：平均相转换，但少数相纹理仍保留</text><text x="55" y="91" font-family="Arial,sans-serif" font-size="16" fill="#53617c">按公开正文数值重绘 · 非论文原图</text><rect x="70" y="135" width="820" height="92" rx="18" fill="#dfe8ff"/><text x="92" y="164" font-family="Arial" font-size="19" font-weight="700" fill="#24427f">300 K · LTO 基体</text><g fill="#657ffc"><rect x="260" y="147" width="38" height="68" rx="8"/><rect x="522" y="147" width="38" height="68" rx="8"/><rect x="770" y="147" width="38" height="68" rx="8"/></g><text x="305" y="188" font-family="Arial" font-size="17" fill="#17213a">LTT样畴壁 ≈150 nm；间隔 0.5–2 μm</text><rect x="70" y="252" width="820" height="92" rx="18" fill="#b8caff"/><text x="92" y="281" font-family="Arial" font-size="19" font-weight="700" fill="#24427f">100 K · LTT 基体</text><g fill="#fff"><rect x="285" y="264" width="58" height="68" rx="9"/><rect x="620" y="264" width="72" height="68" rx="9"/></g><text x="367" y="305" font-family="Arial" font-size="17" fill="#17213a">残余LTO样条带 ≈100–200 nm</text><line x1="70" y1="374" x2="890" y2="374" stroke="#9cb4f4" stroke-width="2"/><text x="70" y="401" font-family="Arial" font-size="15" fill="#53617c">空间分辨率至少约70 nm；图示宽度仅为示意，不按真实比例。</text></svg>
