<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">菱方石墨烯零电阻与异常金属相示意</title><desc id="d">根据论文公开全文重绘的概念相图与判据，不是论文原图。</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#edf4ff"/><stop offset="1" stop-color="#f4efff"/></linearGradient><radialGradient id="sc"><stop stop-color="#5f86ff"/><stop offset="1" stop-color="#819bff" stop-opacity=".15"/></radialGradient><radialGradient id="am"><stop stop-color="#9a73f5"/><stop offset="1" stop-color="#b79cff" stop-opacity=".15"/></radialGradient></defs><rect width="1200" height="680" rx="36" fill="url(#bg)"/><g font-family="Arial,'Microsoft YaHei'" fill="#17233d"><text x="65" y="78" font-size="34" font-weight="700">同一器件中的零电阻与有限电阻口袋</text><text x="65" y="116" font-size="18" fill="#56647c">示意栅压相空间及面内场响应 · 不按原图比例</text><rect x="75" y="160" width="660" height="410" rx="24" fill="white" stroke="#c9d8ff"/><line x1="145" y1="510" x2="680" y2="510" stroke="#53627a" stroke-width="3"/><line x1="145" y1="510" x2="145" y2="215" stroke="#53627a" stroke-width="3"/><text x="410" y="550" text-anchor="middle" font-size="19">载流子密度 n</text><text x="98" y="360" text-anchor="middle" transform="rotate(-90 98 360)" font-size="19">位移场 D</text><ellipse cx="330" cy="360" rx="120" ry="92" fill="url(#sc)" stroke="#5f86ff" stroke-width="4"/><ellipse cx="520" cy="325" rx="110" ry="80" fill="url(#am)" stroke="#8f6cf6" stroke-width="4"/><text x="300" y="350" text-anchor="middle" font-size="21" font-weight="700" fill="#244fb7">零电阻超导</text><text x="535" y="320" text-anchor="middle" font-size="20" font-weight="700" fill="#6843bf">有限电阻饱和</text><path d="M380 285C430 245 465 245 500 270" stroke="#d6a52a" stroke-width="5" stroke-dasharray="10 8" fill="none"/><text x="445" y="225" text-anchor="middle" font-size="16" fill="#805c00">相邻但不等同</text><rect x="790" y="160" width="335" height="410" rx="24" fill="#17233d"/><text x="825" y="215" font-size="22" font-weight="700" fill="white">判据矩阵</text><text x="825" y="264" font-size="18" fill="#cdd8fa">温度 ↓：零电阻 / 饱和</text><text x="825" y="308" font-size="18" fill="#cdd8fa">B⊥ ↑：口袋快速受抑</text><text x="825" y="352" font-size="18" fill="#cdd8fa">电流 ↑：非线性转变</text><text x="825" y="396" font-size="18" fill="#cdd8fa">小 B∥：分离区域趋于合并</text><line x1="825" y1="430" x2="1088" y2="430" stroke="#536180"/><text x="825" y="470" font-size="17" font-weight="700" fill="#ffe09c">尚需排除</text><text x="825" y="503" font-size="16" fill="#e5e9f5">电子过热 · 串联电阻</text><text x="825" y="532" font-size="16" fill="#e5e9f5">涡旋液体 · 空间不均匀</text><text x="75" y="630" font-size="17" fill="#506079">最强证据是同器件连续栅调控；“有限电阻”本身并不自动等于量子金属。</text></g></svg>
