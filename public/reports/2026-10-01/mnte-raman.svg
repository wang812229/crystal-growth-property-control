<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" role="img" aria-labelledby="t d"><title id="t">α-MnTe 生长温度与 175–180 cm⁻¹ Raman 峰</title><desc id="d">200 和 270 摄氏度杂相样品分别有 178 和 177 逆厘米峰，300、400、500 摄氏度相纯样品没有该峰。依据 arXiv 2609.39108 的表1与图1至4原创重绘。</desc><rect width="960" height="400" rx="22" fill="#f5f7ff"/><text x="45" y="55" font-size="25" font-family="Arial,sans-serif" fill="#15264b">α-MnTe：175–180 cm⁻¹ 不是可直接认作本征声子</text><text x="45" y="85" font-size="14" fill="#4a5d83" font-family="Arial,sans-serif">MBE / Si(111)；公开正文 Table 1 与 Fig.1–4；非论文原图</text><line x1="95" y1="296" x2="850" y2="296" stroke="#7389b3" stroke-width="2"/><text x="97" y="330" font-size="13" fill="#4a5d83">生长温度 / °C</text><text x="45" y="210" font-size="13" fill="#4a5d83">峰位 / cm⁻¹</text><g font-family="Arial,sans-serif" text-anchor="middle" font-size="16" fill="#1d376d"><circle cx="220" cy="159" r="16" fill="#5f86ff"/><text x="220" y="135">178</text><text x="220" y="323">200</text><circle cx="350" cy="165" r="16" fill="#5f86ff"/><text x="350" y="140">177</text><text x="350" y="323">270</text><circle cx="490" cy="249" r="12" fill="#a9c2ff"/><text x="490" y="216">未检出</text><text x="490" y="323">300</text><circle cx="650" cy="249" r="12" fill="#a9c2ff"/><text x="650" y="216">未检出</text><text x="650" y="323">400</text><circle cx="810" cy="249" r="12" fill="#a9c2ff"/><text x="810" y="216">未检出</text><text x="810" y="323">500</text></g><text x="113" y="370" font-size="14" font-family="Arial,sans-serif" fill="#4a5d83">200/270 °C：XRD 有 MnTe₂；高激光功率也可在受损 MnTe 区域诱生近邻峰。</text></svg>