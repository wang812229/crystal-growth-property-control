<rect width="1280" height="620" rx="30" fill="url(#bg)"/><text x="64" y="72" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="30" font-weight="700" fill="#15213b">TiTe₂｜把生长、表面与辐照分成三条可核查链</text><text x="64" y="108" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="17" fill="#5c6a89">数字来自 arXiv:2609.11992；示意为本站原创重绘</text>
