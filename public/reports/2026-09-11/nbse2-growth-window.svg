<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" role="img" aria-labelledby="t d"><title id="t">NbSe2 CVT多型窗口</title><desc id="d">比较2H与3R生长温区、冷却和超导证据</desc><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#13b8a6"/><stop offset="1" stop-color="#4f72ff"/></linearGradient></defs><rect width="1200" height="620" rx="28" fill="#071a26"/><text x="70" y="75" fill="#d9f7f2" font-size="30" font-family="Arial">POLYTYPE CONTROL / I₂-CVT</text><g font-family="Arial" fill="#e9f4f7"><rect x="70" y="120" width="480" height="290" rx="24" fill="#102d39"/><text x="105" y="170" font-size="30" font-weight="700">2H · centrosymmetric</text><text x="105" y="228" font-size="25">825 °C  →  795 °C</text><rect x="105" y="255" width="380" height="20" rx="10" fill="#31546a"/><rect x="105" y="255" width="270" height="20" rx="10" fill="#6fb6d2"/><text x="105" y="320" font-size="23">250 h · slow cooling</text><text x="105" y="365" fill="#9cb8c4" font-size="19">AB stacking · Nb:Se ≈ 1.04:2</text><rect x="650" y="120" width="480" height="290" rx="24" fill="#102d39"/><text x="685" y="170" font-size="30" font-weight="700">3R · noncentrosymmetric</text><text x="685" y="228" font-size="25">1050 °C  →  1020 °C</text><rect x="685" y="255" width="380" height="20" rx="10" fill="#31546a"/><rect x="685" y="255" width="350" height="20" rx="10" fill="url(#g)"/><text x="685" y="320" font-size="23">250 h · ice-water quench</text><text x="685" y="365" fill="#9cb8c4" font-size="19">ABC stacking · Nb:Se ≈ 1.128:2</text><path d="M550 265h100" stroke="#8ef0df" stroke-width="4" stroke-dasharray="10 10"/><path d="m635 250 20 15-20 15" fill="#8ef0df"/><g transform="translate(70 455)"><rect width="1060" height="105" rx="20" fill="#0e2631" stroke="#2c5364"/><text x="35" y="43" font-size="22" fill="#8ef0df">BULK EVIDENCE</text><text x="35" y="78" font-size="21">Tc(max) 6.5 K  ·  C/T anomaly 5.95 K  ·  ΔC/γTc 1.52  ·  superconducting volume ≈100%</text></g></g></svg>
