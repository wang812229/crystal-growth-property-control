<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-label="ReO3高压结构与超导窗口">
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f8faff"/><stop offset="1" stop-color="#edf2ff"/></linearGradient><linearGradient id="dome" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#A9C2FF" stop-opacity=".55"/><stop offset=".6" stop-color="#5F86FF" stop-opacity=".8"/><stop offset="1" stop-color="#8b5cf6" stop-opacity=".35"/></linearGradient></defs>
<rect width="1200" height="650" rx="28" fill="url(#bg2)"/><text x="70" y="72" font-family="Arial" font-size="30" font-weight="700" fill="#15213b">ReO₃：八面体转动创造并终止体超导窗口</text><text x="70" y="110" font-family="Arial" font-size="18" fill="#61708f">粉末 DAC 至80 GPa · XRD / Raman / 输运 / dc磁化 / 陷获磁通 / DFT</text>
<rect x="75" y="145" width="1050" height="385" rx="24" fill="#fff" stroke="#d5def6"/><path d="M145 470 L1030 470 M145 470 L145 205" stroke="#98a8c5" stroke-width="2"/><text x="1025" y="500" font-family="Arial" font-size="18" fill="#61708f">压力 (GPa)</text><text x="104" y="225" font-family="Arial" font-size="18" fill="#61708f" transform="rotate(-90 104 225)">Tc</text>
<path d="M205 470 C300 465 340 380 440 315 C545 245 660 250 750 320 C825 378 850 430 930 465 L930 470 Z" fill="url(#dome)"/><path d="M205 470 C300 465 340 380 440 315 C545 245 660 250 750 320 C825 378 850 430 930 465" fill="none" stroke="#5F86FF" stroke-width="8"/>
<circle cx="600" cy="270" r="11" fill="#6d55d8"/><text x="625" y="265" font-family="Arial" font-size="18" font-weight="700" fill="#4f3eb0">28 GPa · Tc,onset≈17.5 K</text><text x="185" y="560" font-family="Arial" font-size="20" font-weight="700" fill="#405a9b">Pm-3m → Im-3</text><text x="485" y="560" font-family="Arial" font-size="20" font-weight="700" fill="#5F70c8">R-3c：体超导</text><text x="825" y="560" font-family="Arial" font-size="20" font-weight="700" fill="#704bb9">R32-like / P2/c</text>
<line x1="760" y1="185" x2="760" y2="500" stroke="#8b5cf6" stroke-width="3" stroke-dasharray="8 8"/><text x="780" y="205" font-family="Arial" font-size="17" fill="#6948b0">35–40 GPa以上</text><text x="780" y="232" font-family="Arial" font-size="17" fill="#6948b0">降对称，EPC与DOS减弱</text>
<rect x="205" y="592" width="790" height="36" rx="18" fill="#e9eeff"/><text x="600" y="616" text-anchor="middle" font-family="Arial" font-size="17" fill="#33466f">最大不确定性：不同压媒、室温定压与低温漂移使结构边界不能逐点硬对应</text>
</svg>
