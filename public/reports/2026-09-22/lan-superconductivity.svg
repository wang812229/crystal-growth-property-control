<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="t d"><title id="t">LaN0.94高压合成与超导证据</title><desc id="d">高压氮气激光熔融、氮占位和三探针超导证据的原创示意。</desc><rect width="1200" height="630" rx="34" fill="#f3f6ff"/><text x="58" y="65" font-family="Arial" font-size="27" font-weight="700" fill="#243457">LaN₀.₉₄ · 缺陷稳定的岩盐超导体</text><text x="58" y="100" font-family="Arial" font-size="16" fill="#68799a">依据 arXiv:2609.23213v1 公开数值重绘</text><g font-family="Arial"><rect x="58" y="140" width="330" height="410" rx="24" fill="#fff" stroke="#d3ddf6"/><text x="88" y="185" font-size="19" font-weight="700" fill="#4b6fdb">高压激光反应</text><circle cx="223" cy="305" r="72" fill="#e5ecff" stroke="#5f86ff" stroke-width="5"/><path d="M150 305h146M223 232v146" stroke="#5f86ff" stroke-width="5"/><text x="120" y="420" font-size="23" font-weight="700" fill="#344866">3000 psi N₂</text><text x="120" y="458" font-size="20" fill="#526481">840 W · 10 rpm</text><text x="120" y="492" font-size="20" fill="#526481">熔融30 min → 淬火</text><rect x="420" y="140" width="330" height="410" rx="24" fill="#fff" stroke="#d3ddf6"/><text x="450" y="185" font-size="19" font-weight="700" fill="#735edc">中子定量结构</text><g transform="translate(490 230)"><g fill="#5f86ff"><circle cx="0" cy="0" r="24"/><circle cx="150" cy="0" r="24"/><circle cx="0" cy="150" r="24"/><circle cx="150" cy="150" r="24"/></g><circle cx="75" cy="75" r="25" fill="#a782ee"/><circle cx="75" cy="75" r="34" fill="none" stroke="#a782ee" stroke-dasharray="5 5"/></g><text x="475" y="445" font-size="22" font-weight="700" fill="#344866">N占位 = 0.943(2)</text><text x="475" y="482" font-size="18" fill="#526481">a = 5.2990(2) Å</text><text x="475" y="515" font-size="16" fill="#68799a">未检出FCC-La伪相</text><rect x="782" y="140" width="360" height="410" rx="24" fill="#fff" stroke="#d3ddf6"/><text x="812" y="185" font-size="19" font-weight="700" fill="#4268de">三探针闭环</text><line x1="825" y1="430" x2="1098" y2="430" stroke="#b