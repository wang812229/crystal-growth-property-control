<rect x="58" y="384" width="1064" height="118" rx="18" fill="#111A30"/><text x="84" y="422" font-family="Arial,Microsoft YaHei" font-size="14" font-weight="700" fill="#A9C2FF">证据边界</text><text x="84" y="457" font-family="Arial,Microsoft YaHei" font-size="16" fill="white">直接观察：体带隙 + 边缘局域峰　｜　模型支持：SOC带反转 + Z₂/Wannier边缘谱</text><text x="84" y="486" font-family="Arial,Microsoft YaHei" font-size="14" fill="#B7C3DD">尚不能单独证明：量子化边缘电导、时间反演保护与无耗散器件性能。</text></svg>
