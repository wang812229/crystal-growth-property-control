<title id="t">Si2Te2 从 CVT 衬底到拓扑边缘态的证据链</title><desc id="d">HfTe2晶体生长、Si2Te2外延参数、体带隙和边缘态空间尺度。</desc>
<defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#5F86FF"/><stop offset="1" stop-color="#7558D3"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#3153a5" flood-opacity=".16"/></filter></defs>
<rect width="1180" height="560" rx="28" fill="#F6F8FF"/><text x="58" y="60" font-family="Arial,Microsoft YaHei" font-size="25" font-weight="700" fill="#111A30">ML-Si₂Te₂：生长—结构—谱学—拓扑</text><text x="58" y="91" font-family="Arial,Microsoft YaHei" font-size="14" fill="#66738E">根据 Nature Communications 公开 Methods 与 Fig. 3–5 数值原创重绘，并非论文原图</text>
<g filter="url(#s)" font-family="Arial,Microsoft YaHei"><rect x="58" y="132" width="250" height="205" rx="18" fill="white"/><rect x="58" y="132" width="250" height="9" rx="5" fill="#5F86FF"/><text x="82" y="178" font-size="14" font-weight="700" fill="#426BEA">01 · HfTe₂ CVT</text><text x="82" y="218" font-size="21" font-weight="700" fill="#111A30">900 → 800 °C</text><text x="82" y="250" font-size="16" fill="#52617A">I₂ 5 mg mL⁻¹</text><text x="82" y="281" font-size="16" fill="#52617A">2 周 · 金色片晶</text><text x="82" y="312" font-size="13" fill="#7A86A0">晶格失配约 0.6%</text>
<rect x="335" y="132" width="250" height="205" rx="18" fill="white"/><rect x="335" y="132" width="250" height="9" rx="5" fill="#6C76F0"/><text x="359" y="178" font-size="14" font-weight="700" fill="#5E62D8">02 · MBE + 退火</text><text x="359" y="218" font-size="21" font-weight="700" fill="#111A30">200 °C 共蒸发</text><text x="359" y="250" font-size="16" fill="#52617A">Te:Si &gt; 20:1</text><text x="359" y="281" font-size="16" fill="#52617A">≈ 1 ML h⁻¹</text><text x="359" y="312" font-size="13" fill="#7A86A0">385 °C × 5 min</text>
<rect x="612" y="132" width="250" height="205" rx="18" fill="white"/><rect x="612" y="132" width="250" height="9" rx="5" fill="#7868E8"/><text x="636" y="178" font-size="14" font-weight="700" fill="#6754D2">03 · STM / STS</text><text x="636" y="218" font-size="21" font-weight="700" fill="#111A30">体带隙 ≈ 300 meV</text><text x="636" y="250" font-size="16" fill="#52617A">5.8 K · UHV</text><text x="636" y="281" font-size="16" fill="#52617A">完整 (1×1) 晶格</text><text x="636" y="312" font-size="13" fill="#7A86A0">岛中心为空隙，边缘有峰</text>
<rect x="889" y="132" width="233" height="205" rx="18" fill="url(#g)"/><text x="913" y="178" font-size="14" font-weight="700" fill="#EAF0FF">04 · 边缘证据</text><text x="913" y="218" font-size="24" font-weight="700" fill="white">1.5–2.0 nm</text><text x="913" y="251" font-size="16" fill="#EFF2FF">边缘态空间延展</text><text x="913" y="283" font-size="16" fill="#EFF2FF">+7 mV 亮边界</text><text x="913" y="313" font-size="13" fill="#E0E7FF">DFT/Wannier 同尺度</text></g>
