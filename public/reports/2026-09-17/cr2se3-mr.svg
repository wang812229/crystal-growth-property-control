<rect x="160" y="113" width="381" height="25" rx="7" fill="#a9c2ff"/><rect x="160" y="161" width="560" height="25" rx="7" fill="#5f86ff"/><rect x="160" y="209" width="4" height="25" rx="2" fill="#a9c2ff"/>
