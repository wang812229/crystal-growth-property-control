<text x="85" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#345bd7">01 · 高压密封安瓿 CVT</text><text x="530" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#345bd7">02 · 空气暴露</text><text x="895" y="190" font-family="Arial,'Microsoft YaHei',sans-serif" font-size="20" font-weight="700" fill="#6f52d9">03 · 电子束路径</text>
<g font-family="Arial,'Microsoft YaHei',sans-serif"><rect x="85" y="225" width="350" height="58" rx="16" fill="#edf3ff"/><text x="105" y="260" font-size="18" fill="#1b2a4b">Ti 0.0528 g + Te 0.2071 g</text><path d="M260 290v32" stroke="#7899f5" stroke-width="4"/><path d="m250 314 10 12 10-12" fill="none" stroke="#7899f5" stroke-width="4"/><rect x="85" y="330" width="350" height="70" rx="16" fill="#edf3ff"/><text x="105" y="360" font-size="18" fill="#1b2a4b">N₂回填 → 5000–500 mTorr</text><text x="105" y="384" font-size="14" fill="#687595">升温时内压高于 1 atm</text><path d="M260 406v32" stroke="#7899f5" stroke-width="4"/><path d="m250 430 10 12 10-12" fill="none" stroke="#7899f5" stroke-width="4"/><rect x="85" y="446" width="350" height="76" rx="16" fill="url(#hot)"/><text x="105" y="478" font-size="18" font-weight="700" fill="white">10 °C/min → 900–1000 °C</text><text x="105" y="504" font-size="16" fill="#eef3ff">5 d，自然冷却；循环 3–5 次</text>
